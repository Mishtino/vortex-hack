[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vortex-hack"
version = "0.2.0"
description = "Vortex Technologies authorized website configuration review toolkit"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Vortex Technologies"}]
dependencies = []

[project.scripts]
vortex-hack = "vortex:main"

[tool.setuptools]
py-modules = ["vortex", "vortex_report"]
